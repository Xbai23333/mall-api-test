name: Mall API Test CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run unit tests and generate report
        run: |
          mkdir -p reports
          python -m pytest tests/test_assertions.py -q --html=reports/unit_test_report.html --self-contained-html

      - name: Upload HTML test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mall-unit-test-report
          path: reports/unit_test_report.html
          if-no-files-found: warn